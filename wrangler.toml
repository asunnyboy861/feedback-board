name = "feedback-board"
main = "worker.js"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "msg.calcs.top", custom_domain = true }
]

# 保留默认 workers.dev 地址（已有大量客户端在使用，不可关闭）
workers_dev = true

[env.production]
vars = { ENVIRONMENT = "production" }

[vars]
# 不要在此填写真实密钥，请使用 Cloudflare Dashboard / wrangler secret 设置
# RESEND_API_KEY = "your_resend_api_key_here"
NOTIFICATION_EMAIL = "Carl@zzoutuo.com"
FROM_EMAIL = "softfeedback@soft.calcs.top"

[[d1_databases]]
binding = "DB"
database_name = "feedback_db"
database_id = "04df2025-abbe-4bd8-bf76-9758d21991df"
